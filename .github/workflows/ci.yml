name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No lockfile is committed yet, and setup-node's pnpm cache needs one.
      # Once pnpm-lock.yaml is committed, add `cache: pnpm` here and switch
      # the install step to --frozen-lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm format:check

      - name: Build preview
        run: pnpm preview:build

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: dist/preview/index.html
