name: Deploy website

# Publishes the built site to GitHub Pages on every push to main.
# GitHub Free serves Pages only from public repositories, so while the repository is
# private the jobs are skipped rather than failed. To start deploying: make the
# repository public, set Settings > Pages > Source to "GitHub Actions", then run this
# workflow from the Actions tab (or push to main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build website
        run: pnpm web:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
